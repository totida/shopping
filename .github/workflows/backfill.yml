name: Price history backfill

on:
  workflow_dispatch:
    inputs:
      since:
        description: "이 날짜 이후 글만 (YYYY-MM-DD)"
        default: "2026-01-01"
      debug:
        description: "페이지 샘플을 로그에 출력 (1)"
        default: "1"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search board and collect prices
        env:
          SINCE: ${{ inputs.since }}
          DEBUG: ${{ inputs.debug }}
        run: python backfill.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "올해 가격 기록 수집 (backfill)"
            git push
          fi
