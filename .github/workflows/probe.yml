name: Connectivity probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try ppomppu URLs
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          show() { iconv -f cp949 -t utf-8 -c "$1" 2>/dev/null || cat "$1"; }
          echo "=== http view raw"
          curl -sS -A "$UA" -i "http://www.ppomppu.co.kr/zboard/view.php?id=ppomppu8&no=100250" | head -30
          echo "=== http view follow + cookies"
          curl -sS -L -c /tmp/c -b /tmp/c -A "$UA" -o /tmp/v -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' "http://www.ppomppu.co.kr/zboard/view.php?id=ppomppu8&no=100250"
          show /tmp/v | head -c 600; echo
          for u in "http://m.ppomppu.co.kr/new/bbs_view.php?id=ppomppu8&no=100250" "http://www.ppomppu.co.kr/zboard/zboard.php?id=ppomppu8" "http://m.ppomppu.co.kr/new/bbs_list.php?id=ppomppu8"; do
            echo "=== $u"
            curl -sS -L -c /tmp/c -b /tmp/c -A "$UA" -o /tmp/o -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' "$u"
          done
          echo "=== search_bbs"
          curl -sS -A "$UA" -o /tmp/s -w 'status=%{http_code} size=%{size_download}\n' "https://www.ppomppu.co.kr/search_bbs.php?search_type=sub_memo&page_no=1&keyword=K12&page_size=50&bbs_id=ppomppu8&order_type=date"
          show /tmp/s > /tmp/s8
          grep -o 'id=ppomppu8[^"]*' /tmp/s8 | head -10
          grep -c 'ppomppu8' /tmp/s8
          python3 - <<'PY'
          t = open('/tmp/s8', encoding='utf-8', errors='replace').read()
          i = t.find('ppomppu8&')
          print(t[max(0, i - 1500): i + 2500] if i >= 0 else t[:3000])
          PY
