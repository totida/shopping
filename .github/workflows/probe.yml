name: Connectivity probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect search form
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          curl -sS -A "$UA" "https://www.ppomppu.co.kr/search_bbs.php?search_type=sub_memo&page_no=1&keyword=FIREBAT&bbs_id=ppomppu8&order_type=date" -o /tmp/s
          iconv -f cp949 -t utf-8 -c /tmp/s > /tmp/s8
          echo "results: $(grep -c '<div class="conts">' /tmp/s8)"
          python3 - <<'PY'
          import re
          t = open('/tmp/s8', encoding='utf-8', errors='replace').read()
          for m in re.finditer(r'(?is)<(form|input|select|option)\b[^>]*>', t):
              tag = m.group(0)
              if 'hidden' in tag or 'name=' in tag or 'value=' in tag or '<form' in tag.lower():
                  print(tag[:200])
          # 검색 옵션 / 페이지 링크
          for m in re.finditer(r'search_bbs\.php\?[^"\'\s>]*', t):
              print('LINK', m.group(0)[:250])
          i = t.find('id_search_option')
          print(t[i-200:i+3000] if i >= 0 else 'no option block')
          PY
          for p in 9 10 11 20; do
            n=$(curl -sS -A "$UA" "https://www.ppomppu.co.kr/search_bbs.php?search_type=sub_memo&page_no=$p&keyword=7640HS&bbs_id=ppomppu8&order_type=date" | iconv -f cp949 -t utf-8 -c | grep -c '<div class="conts">')
            echo "7640HS page $p: $n"; sleep 3
          done
