name: GMKtec K12 price monitor

on:
  # 자동 실행 중지: 감시를 갤럭시탭(한국 IP)으로 옮김. 다시 켜려면 아래 두 줄의 주석을 푸세요.
  # schedule:
  #   - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "시험 알림만 보내기 (감시는 하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write  # 가격 기록(data/price_history.csv) 커밋
  issues: write    # 가격 알림 이슈 생성

concurrency:
  group: k12-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THRESHOLD_USD: "200"
          KRW_PER_USD: "1400"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python monitor.py

      - name: Commit price history
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "K12 가격 기록 업데이트"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
